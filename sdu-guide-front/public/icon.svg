<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#4C6740"/>
  <!-- Inner glow -->
  <rect width="512" height="512" rx="96" fill="url(#g)" opacity="0.3"/>
  <defs>
    <radialGradient id="g" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- SDU text -->
  <text x="256" y="290"
        font-family="Georgia, serif"
        font-size="200"
        font-weight="700"
        fill="#ffffff"
        text-anchor="middle"
        letter-spacing="-4">SDU</text>
  <!-- GUIDE subtitle -->
  <text x="256" y="370"
        font-family="Arial, sans-serif"
        font-size="64"
        font-weight="400"
        fill="rgba(255,255,255,0.65)"
        text-anchor="middle"
        letter-spacing="16">GUIDE</text>
</svg>
