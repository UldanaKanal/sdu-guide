services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sdu_guide
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  flyway:
    image: flyway/flyway:10-alpine
    command: >
      -url=jdbc:postgresql://postgres:5432/sdu_guide
      -user=postgres
      -password=postgres
      -connectRetries=10
      migrate
    volumes:
      - ./db/migrations:/flyway/sql
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./sdu-guide-back
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/sdu_guide?sslmode=disable
      REDIS_ADDR: redis:6379
      LISTEN_ADDR: 0.0.0.0:8000
    volumes:
      - uploads:/app/uploads
      - ./db/schedules:/app/seeds:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully

  frontend:
    build: ./sdu-guide-front
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads:
